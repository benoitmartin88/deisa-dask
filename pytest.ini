[pytest]
# Logging
log_cli = true
log_cli_level = DEBUG
log_format = %(levelname)s:%(name)s:%(message)s
log_date_format = %H:%M:%S

# Output
addopts = -ra

# Test discovery
testpaths = test
# test/benchmarks/ holds pytest-benchmark timing tests, which must never run as part of a
# correctness run: norecursedirs stops RECURSIVE discovery by directory name while an explicit
# file argument (pytest test/benchmarks/test_bench_smoke.py) still collects. Run benchmarks
# explicitly, e.g.
#   .venv/bin/python -m pytest test/benchmarks/test_bench_smoke.py --benchmark-only -q
norecursedirs = .* build dist venv .venv benchmarks

# Markers
markers =
    benchmark: timing measurement, run only via an explicit pytest target under test/benchmarks/

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout
timeout = 300