[pytest]
# Logging
log_cli = true
# WARNING, not DEBUG: live DEBUG output from distributed/tornado costs ~10x wall time on the cluster-heavy
# cases (a 10-iteration register_callback case: 43 s at DEBUG vs 4 s with no live logging), which pushed
# them past their `pytest.mark.timeout(30)` budget. Captured logs (caplog) are unaffected.
log_cli_level = WARNING
log_format = %(levelname)s:%(name)s:%(message)s
log_date_format = %H:%M:%S

# Output
addopts = -ra

# Test discovery
testpaths = test

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout
timeout = 300