# This workflow runs a pytest benchmark of a PR's head branch whenever the PR targets this repository's main branch,
# on any modification to it. Works for PRs from forks. Outputs artifacts for benchmarks_pr_track.yml.
name: Benchmarks for pull requests

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
    branches: [ "main" ]

jobs:
  benchmark_fork_pr_branch:
    name: Run fork PR benchmarks
    runs-on: ubuntu-latest
    env:
      UCX_TLS: tcp,self
      FI_PROVIDER: tcp
      PYTHONOPTIMIZE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir mpi4py openmpi
          python -m pip install dask==2026.3.0 distributed==2026.3.0
          python -m pip install .
          python -m pip install .[benchmark]


      - name: Run pytest benchmarks
        run: |
          pytest --log-cli-level=INFO benchmark/ --ignore=benchmark/test_dask_queue.py

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bencher-result.json
          path: ./bencher-result.json

      - name: Upload GitHub pull request event
        uses: actions/upload-artifact@v4
        with:
          name: event.json
          path: ${{ github.event_path }}
